<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Time blocker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--prolly date.now-->
        <header>
        <h1>My Day</h1>
        <div class="day-nav">
            <button id="prev-day" class="nav-btn">←</button>
            <span id="today-date"></span>
            <button id="next-day" class="nav-btn">→</button>
            <button id="today-btn" class="nav-btn">Today</button>
        </div>
        
        </header>
        <main>
            <!--would make the system change by adding dragging time blocking rather than manual entry-->
            <section class="add-block">
                <h2>Add a block</h2>
                <form id="block-form">
                    <input type="text" id="title" placeholder="What are you doing?" required>
                    <div class="row">
                        <input type="time" id="start" required>
                        <input type="time" id="end" required>
                    </div>
                    <select id="category">
                        <option value="part-a">Part-A</option>
                        <option value="part-b">Part-B</option>
                        <option value="pyqs">PYQ'S</option>
                        <option value="sketching">Sketching</option>
                        <option value="test">Test</option>
                        <option value="survive">Survive</option>
                        <option value="terra">Terra</option>
                        <option value="wrong-pixl">Wrong/pixl</option>
                        <option value="crossroads">Crossroads</option>
                        <option value="embassy">Embassy</option>
                        <option value="gym">Gym</option>
                        <option value="rest">Rest</option>
                    </select>
                    <button type="submit">Add block</button>
                    <button type="button" id="cancel-edit" class="cancel-btn" hidden>Cancel</button>
                </form>
                <p id="message"></p>
                <button type="button" id="undo-btn" class="cancel-btn" hidden>Undo delete</button>
            </section>
            <section class="status-section">
                <div id="up-next" class="up-next"></div>
                <p id="progress-text" class="progress-text"></p>
                <div class="progress-track">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <!--notificationssssss-->
                <button id="notify-btn" class="notify-btn">Turn on reminders</button>
                <p id="reminder-status" class="reminder-status"></p>
                <button id="clear-done-btn" class="cancel-btn">Clear finished blocks</button>
            </section>

            <section class="timeline-section">
                <h2>Calendar</h2>
                <p class="hint">Drag down a column to pick a time, then name it.</p>
                <div class="calendar">
                    <div class="hour-labels" id="hour-labels"></div>
                    <div class="day-column" id="day-column"></div>
                </div>
                
                <div id="category-totals" class="totals"></div>
                <!--<div id="timeline"></div>-->
            </section>
        </main>
        <script src="app.js"></script>
    </body>
</html>
